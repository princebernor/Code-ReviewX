# Render Blueprint: backend + PostgreSQL. Secrets are generated by Render or wired from the database;
# none of them exist in this repository.
databases:
  - name: code-reviewx-db
    plan: free
    databaseName: codereviewx
    user: codereviewx

services:
  - type: web
    name: code-reviewx-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CRX_JWT_SECRET
        generateValue: true
      - key: CRX_DB_HOST
        fromDatabase:
          name: code-reviewx-db
          property: host
      - key: CRX_DB_PORT
        fromDatabase:
          name: code-reviewx-db
          property: port
      - key: CRX_DB_NAME
        fromDatabase:
          name: code-reviewx-db
          property: database
      - key: CRX_DB_USER
        fromDatabase:
          name: code-reviewx-db
          property: user
      - key: CRX_DB_PASSWORD
        fromDatabase:
          name: code-reviewx-db
          property: password
      # Vercel and Render proxies set X-Forwarded-*, so rate limits see the real client address.
      - key: CRX_FORWARD_HEADERS
        value: framework
      # The free plan has 512 MB of memory.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1

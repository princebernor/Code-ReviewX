# Render Blueprint: the backend. The database is hosted on Neon; its connection settings are entered in the Render
# dashboard (sync: false), and the signing key is generated by Render. No secret exists in this repository.
services:
  - type: web
    name: code-reviewx-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    # The frontend is served by Vercel, so frontend-only commits need no backend rebuild.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CRX_JWT_SECRET
        generateValue: true
      # jdbc:postgresql://<host>/<database>?sslmode=require
      - key: CRX_DB_URL
        sync: false
      - key: CRX_DB_USER
        sync: false
      - key: CRX_DB_PASSWORD
        sync: false
      - key: CRX_RESET_LINK_BASE
        value: https://code-reviewx.vercel.app/index.html
      # Vercel and Render proxies set X-Forwarded-*, so rate limits see the real client address.
      - key: CRX_FORWARD_HEADERS
        value: framework
      # The free plan has 512 MB of memory.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1

# Production-like stack: backend (serving the frontend) + PostgreSQL.
# Requires backend/.env (copy backend/.env.example and fill in real values).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: codereviewx
      POSTGRES_USER: ${CRX_DB_USER:-codereviewx}
      POSTGRES_PASSWORD: ${CRX_DB_PASSWORD:?set CRX_DB_PASSWORD in backend/.env}
    volumes:
      - crx-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      CRX_DB_URL: jdbc:postgresql://db:5432/codereviewx
      CRX_FRONTEND_DIR: /app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  crx-db:
